<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆好拼</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap;font-size:12px}
.toolbar h1{font-size:16px;color:#e94560;margin-right:8px;white-space:nowrap}
.toolbar button{padding:5px 10px;border:1px solid #0f3460;border-radius:5px;background:#0f3460;color:#e0e0e0;cursor:pointer;font-size:12px;white-space:nowrap;transition:all 0.15s}
.toolbar button:hover{background:#1a4a7a;border-color:#1a4a7a}
.toolbar button.active{background:#e94560;border-color:#e94560}
.toolbar button:disabled{opacity:0.4;cursor:not-allowed}
.toolbar button.primary{background:#1a6a3a;border-color:#1a6a3a}
.toolbar button.primary:hover{background:#228b4a;border-color:#228b4a}
.toolbar .sep{width:1px;height:20px;background:#0f3460;margin:0 2px}
.toolbar label{color:#aaa;font-size:11px;white-space:nowrap}
.toolbar input[type=number]{width:52px;padding:3px 4px;background:#111;border:1px solid #0f3460;border-radius:4px;color:#e0e0e0;font-size:11px;text-align:center}
.toolbar input[type=number]:focus{outline:none;border-color:#e94560}
.main{display:flex;flex:1;overflow:hidden}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#1a1a1a;cursor:default}
.canvas-wrap canvas{position:absolute;top:0;left:0}
.upload-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#444;font-size:13px;pointer-events:none}
.loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:20;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#e94560;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#ccc;font-size:13px}
.sidebar{width:300px;background:#16213e;border-left:1px solid #0f3460;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:10px 14px;border-bottom:1px solid #0f3460;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sidebar-list{flex:1;overflow-y:auto;padding:6px}
.color-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;margin-bottom:3px;transition:background 0.15s;border:2px solid transparent;font-size:12px}
.color-item:hover{box-shadow:inset 0 0 0 100px rgba(128,128,128,0.2)}
.color-item.selected{outline:2px solid #e94560;outline-offset:-2px;border-color:transparent}
.color-item .info{flex:1;min-width:0}
.color-item .info .code{font-weight:600;font-size:12px}
.color-item .info .count{font-size:10px;opacity:0.75}
.cell-info{padding:10px 14px;border-top:1px solid #0f3460;font-size:12px;flex-shrink:0;max-height:180px;overflow-y:auto}
.cell-info .label{color:#888;font-size:10px;margin-top:4px}
.cell-info .label:first-child{margin-top:0}
.cell-info .val{color:#e0e0e0;margin-bottom:2px}
.cell-info .swatch-preview{display:inline-block;width:40px;height:20px;border-radius:3px;border:1px solid #333;vertical-align:middle;margin-left:6px}
.statusbar{height:26px;background:#16213e;border-top:1px solid #0f3460;display:flex;align-items:center;padding:0 14px;font-size:11px;color:#888;gap:16px;flex-shrink:0}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#e94560;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:200;animation:fadeIn 0.2s;pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.fine-tune-panel{position:absolute;top:100%;right:0;background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:8px 10px;z-index:50;display:flex;flex-direction:column;gap:6px;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.ft-row{display:flex;align-items:center;gap:4px}
.ft-label{font-size:10px;color:#888;width:48px;flex-shrink:0;text-align:right;margin-right:4px}
.ft-row button{padding:4px 9px;font-size:12px;border:1px solid #0f3460;border-radius:4px;background:#0f3460;color:#e0e0e0;cursor:pointer;min-width:28px;text-align:center}
.ft-row button:active{background:#e94560}
.toolbar{position:relative}
.color-item .edit-btn{font-size:10px;padding:1px 5px;background:transparent;border:1px solid rgba(255,255,255,0.3);border-radius:3px;color:inherit;cursor:pointer;opacity:0.7}
.color-item .edit-btn:hover{opacity:1}
.color-item input[type=checkbox]{accent-color:#e94560;pointer-events:none;flex-shrink:0}
@media (orientation:portrait){
  .main{flex-direction:column}
  .sidebar{width:100%;max-height:40vh;border-left:none;border-top:1px solid #0f3460}
  .sidebar-list{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;gap:4px;padding:6px 8px;align-items:center}
  .sidebar-list .color-item{flex-shrink:0;margin-bottom:0;white-space:nowrap;padding:5px 10px;border-radius:5px}
  .sidebar-header{padding:5px 10px;font-size:11px}
  .cell-info{max-height:100px;font-size:11px}
}
@media (orientation:landscape){
  .sidebar{width:200px}
}
@media (max-width:480px){
  .toolbar{padding:4px 6px;gap:3px}
  .toolbar h1{font-size:13px;margin-right:4px}
  .toolbar button{padding:3px 7px;font-size:10px}
  .toolbar .sep{margin:0 1px}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>豆好拼</h1>
  <button id="btnUpload" onclick="document.getElementById('fileInput').click()">上传图纸</button>
  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg" hidden onchange="handleUpload(this)">
  <span class="sep"></span>
  <button id="btnLock" class="primary" onclick="lockGrid()" disabled>切分</button>
  <span id="editModeSep" class="sep" style="display:none"></span>
  <span id="editModeLabel" style="display:none;color:#e94560;font-size:12px;font-weight:600"></span>
  <button id="btnFinishEdit" style="display:none" onclick="exitEditMode()">完成编辑</button>
  <span class="sep"></span>
  <button id="btnBeading" onclick="toggleBeadingMode()" disabled>开始拼豆</button>
  <span class="sep"></span>
  <button id="btnFit" onclick="resetImage()">适应</button>
  <span style="position:relative;display:inline-block">
    <button id="btnFineTune" onclick="toggleFineTune()">微调</button>
    <div class="fine-tune-panel" id="fineTunePanel" style="display:none">
      <div class="ft-row">
        <span class="ft-label">位置</span>
        <button onclick="nudgeImage(0,-1)">↑</button>
        <button onclick="nudgeImage(-1,0)">←</button>
        <button onclick="nudgeImage(1,0)">→</button>
        <button onclick="nudgeImage(0,1)">↓</button>
      </div>
      <div class="ft-row">
        <span class="ft-label">缩放</span>
        <button onclick="nudgeScale(-0.01)">-</button>
        <button onclick="nudgeScale(0.01)">+</button>
      </div>
    </div>
  </span>
</div>

<div class="main">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mainCanvas"></canvas>
    <div class="upload-hint" id="uploadHint">点击左上角「上传图纸」加载图片</div>
    <div class="loading-overlay" id="loadingOverlay" style="display:none">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">处理中...</div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-header">颜色映射 <span style="color:#888;font-weight:400;font-size:11px" id="mapCount"></span></div>
    <div class="sidebar-list" id="colorMapList">
      <div style="color:#555;text-align:center;padding:30px 0;font-size:12px">切分后颜色映射显示在此处</div>
    </div>
    <div class="cell-info" id="cellInfo">
      <div style="color:#555;font-size:11px">切分后点击格子查看详情</div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="statusImage">未加载图片</span>
  <span id="statusPos"></span>
  <span id="statusCells"></span>
</div>

<canvas id="offscreenCanvas" style="display:none"></canvas>

<script>
// ===== 状态 =====
const state = {
  image: null,

  // 图片变换
  imgScale: 1,
  imgOffX: 0,   // 图片左上角屏幕坐标
  imgOffY: 0,

  // 无限网格（仅两个参数）
  cellSize: 45,        // 格子边长（屏幕像素）
  gridOffX: 0,         // 网格原点屏幕偏移
  gridOffY: 0,

  // 切分后
  locked: false,
  cells: null,         // Map<"r,c", {row,col,imgX,imgY,size,rgb,code}>
  colorMap: null,      // Map<code, {code,rgb,cells:[{row,col},...]}>
  selectedCell: null,  // {row,col}
  highlightedCode: null,

  // 编辑模式（批量分配格子）
  editMode: false,
  editingCode: null,

  // 拼豆模式
  beadingMode: false,
  activeColors: new Set(),

  // 拖拽状态
  dragging: false,
  hasMoved: false,
  dragStartImgOff: {x:0,y:0},
  dragStartMouse: {x:0,y:0},

  // 双指缩放
  pinching: false,
  pinchStartDist: 0,
  pinchStartScale: 1,
  pinchMidImg: {x:0,y:0},
  pinchMidScr: {x:0,y:0},
};

// ===== DOM =====
const canvasWrap = document.getElementById('canvasWrap');
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');
const offCanvas = document.getElementById('offscreenCanvas');
const offCtx = offCanvas.getContext('2d');

// ===== 图片加载 =====
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadImage(file);
});

function handleUpload(input) {
  const file = input.files[0];
  if (file) loadImage(file);
  input.value = '';
}

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      resetAll();
      document.getElementById('uploadHint').style.display = 'none';
      resetImage();
      updateStatus();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function resetAll() {
  state.locked = false;
  state.editMode = false;
  state.editingCode = null;
  state.beadingMode = false;
  state.activeColors = new Set();
  state.cells = null;
  state.colorMap = null;
  state.selectedCell = null;
  state.highlightedCode = null;
  document.getElementById('btnLock').disabled = false;
  document.getElementById('btnBeading').disabled = true;
  document.getElementById('btnBeading').textContent = '开始拼豆';
  updateEditModeUI();
  renderColorMap();
  renderCellInfo();
  document.getElementById('statusCells').textContent = '';
}

function resetImage() {
  if (!state.image) return;
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  const scale = Math.min(cw / state.image.width, ch / state.image.height, 0.8);
  state.imgScale = scale;
  state.imgOffX = (cw - state.image.width * scale) / 2;
  state.imgOffY = (ch - state.image.height * scale) / 2;
  render();
}

// ===== 渲染 =====
function render() {
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  mainCanvas.width = cw;
  mainCanvas.height = ch;
  ctx.clearRect(0, 0, cw, ch);

  if (!state.image) return;

  // 图片
  const iw = state.image.width * state.imgScale;
  const ih = state.image.height * state.imgScale;
  ctx.drawImage(state.image, state.imgOffX, state.imgOffY, iw, ih);

  // 网格仅在对齐模式显示，切分后消失
  if (!state.locked) drawInfiniteGrid();

  // 拼豆模式：图纸变灰，仅选中色号高亮
  if (state.beadingMode && state.cells) {
    drawDimOverlay();
    drawActiveCells();
  }

  // 锁定后的高亮
  if (state.locked && !state.beadingMode && state.cells) {
    drawCellHighlights();
    if (state.selectedCell) drawSelectedCell();
  }
}

function drawDimOverlay() {
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, cw, ch);
}

function drawActiveCells() {
  if (!state.activeColors || state.activeColors.size === 0) return;
  const s = state.imgScale;
  const ox = state.imgOffX, oy = state.imgOffY;

  for (const code of state.activeColors) {
    const entry = state.colorMap.get(code);
    if (!entry) continue;
    for (const {row, col} of entry.cells) {
      const cell = state.cells.get(`${row},${col}`);
      if (!cell) continue;
      const sx = ox + cell.imgX * s;
      const sy = oy + cell.imgY * s;
      const ss = cell.size * s;
      // 裁切原图对应区域，以全色绘制
      ctx.drawImage(state.image,
        cell.imgX, cell.imgY, cell.size, cell.size,
        sx, sy, ss, ss);
    }
  }
}

function drawInfiniteGrid() {
  const cw = canvasWrap.clientWidth;
  const ch = canvasWrap.clientHeight;
  const cs = state.cellSize;
  if (cs < 5) return;

  const modX = ((state.gridOffX % cs) + cs) % cs;
  const modY = ((state.gridOffY % cs) + cs) % cs;

  ctx.strokeStyle = 'rgba(233,69,96,0.55)';
  ctx.lineWidth = 1.5;

  for (let x = modX; x < cw; x += cs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
  }
  for (let x = modX - cs; x >= 0; x -= cs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
  }
  for (let y = modY; y < ch; y += cs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
  }
  for (let y = modY - cs; y >= 0; y -= cs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
  }
}

function drawCellHighlights() {
  if (!state.highlightedCode || !state.colorMap) return;
  const entry = state.colorMap.get(state.highlightedCode);
  if (!entry) return;

  const s = state.imgScale;
  const ox = state.imgOffX, oy = state.imgOffY;

  ctx.fillStyle = 'rgba(233,69,96,0.35)';
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 1;

  for (const {row, col} of entry.cells) {
    const cell = state.cells.get(`${row},${col}`);
    if (!cell) continue;
    const sx = ox + cell.imgX * s;
    const sy = oy + cell.imgY * s;
    const ss = cell.size * s;
    ctx.fillRect(sx, sy, ss, ss);
    ctx.strokeRect(sx, sy, ss, ss);
  }
}

function drawSelectedCell() {
  const { row, col } = state.selectedCell;
  const cell = state.cells.get(`${row},${col}`);
  if (!cell) return;

  const s = state.imgScale;
  const ox = state.imgOffX, oy = state.imgOffY;
  const sx = ox + cell.imgX * s;
  const sy = oy + cell.imgY * s;
  const ss = cell.size * s;

  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(sx - 0.5, sy - 0.5, ss + 1, ss + 1);
}

// ===== 交互 =====
function screenToImage(sx, sy) {
  return {
    x: (sx - state.imgOffX) / state.imgScale,
    y: (sy - state.imgOffY) / state.imgScale,
  };
}

canvasWrap.addEventListener('mousedown', e => {
  if (!state.image) return;
  state.dragging = true;
  state.hasMoved = false;
  state.dragStartMouse = { x: e.clientX, y: e.clientY };
  state.dragStartImgOff = { x: state.imgOffX, y: state.imgOffY };
  canvasWrap.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  state.hasMoved = true;
  state.imgOffX = state.dragStartImgOff.x + (e.clientX - state.dragStartMouse.x);
  state.imgOffY = state.dragStartImgOff.y + (e.clientY - state.dragStartMouse.y);
  updatePosStatus();
  render();
});

window.addEventListener('mouseup', e => {
  if (!state.dragging) return;
  state.dragging = false;
  canvasWrap.style.cursor = '';
  if (!state.hasMoved && state.locked && !state.beadingMode) {
    const rect = mainCanvas.getBoundingClientRect();
    const imgPos = screenToImage(e.clientX - rect.left, e.clientY - rect.top);
    if (state.editMode) {
      handleEditClick(imgPos.x, imgPos.y);
    } else {
      handleCellClick(imgPos.x, imgPos.y);
    }
  }
});

canvasWrap.addEventListener('wheel', e => {
  if (!state.image) return;
  e.preventDefault();

  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // 滚轮精细缩放，Ctrl+滚轮更细
  const ctrl = e.ctrlKey;
  const factor = e.deltaY < 0 ? (ctrl ? 1.01 : 1.03) : (ctrl ? 0.99 : 0.97);
  const oldS = state.imgScale;
  state.imgScale = Math.max(0.05, Math.min(30, state.imgScale * factor));
  state.imgOffX = mx - (mx - state.imgOffX) * (state.imgScale / oldS);
  state.imgOffY = my - (my - state.imgOffY) * (state.imgScale / oldS);
  updatePosStatus();
  render();
}, { passive: false });

// ===== 触屏 =====
function startPinch(touches) {
  state.pinching = true;
  state.dragging = false;
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  state.pinchStartDist = Math.hypot(dx, dy);
  state.pinchStartScale = state.imgScale;
  const rect = mainCanvas.getBoundingClientRect();
  const mx = (touches[0].clientX + touches[1].clientX) / 2 - rect.left;
  const my = (touches[0].clientY + touches[1].clientY) / 2 - rect.top;
  state.pinchMidScr = { x: mx, y: my };
  state.pinchMidImg = { x: (mx - state.imgOffX) / state.imgScale, y: (my - state.imgOffY) / state.imgScale };
}

canvasWrap.addEventListener('touchstart', e => {
  if (!state.image) return;
  if (e.touches.length === 2) {
    e.preventDefault();
    startPinch(e.touches);
    return;
  }
  if (e.touches.length !== 1) return;
  e.preventDefault();
  state.dragging = true;
  state.hasMoved = false;
  state.dragStartMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  state.dragStartImgOff = { x: state.imgOffX, y: state.imgOffY };
}, { passive: false });

canvasWrap.addEventListener('touchmove', e => {
  if (!state.image) return;
  if (state.pinching && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const newScale = Math.max(0.05, Math.min(30, state.pinchStartScale * (dist / state.pinchStartDist)));
    state.imgScale = newScale;
    state.imgOffX = state.pinchMidScr.x - state.pinchMidImg.x * newScale;
    state.imgOffY = state.pinchMidScr.y - state.pinchMidImg.y * newScale;
    updatePosStatus();
    render();
    return;
  }
  if (state.dragging && e.touches.length === 1) {
    e.preventDefault();
    state.hasMoved = true;
    state.imgOffX = state.dragStartImgOff.x + (e.touches[0].clientX - state.dragStartMouse.x);
    state.imgOffY = state.dragStartImgOff.y + (e.touches[0].clientY - state.dragStartMouse.y);
    updatePosStatus();
    render();
  }
}, { passive: false });

canvasWrap.addEventListener('touchend', e => {
  if (e.touches.length === 0) {
    if (state.dragging && !state.hasMoved && state.locked && !state.beadingMode) {
      const rect = mainCanvas.getBoundingClientRect();
      const tx = state.dragStartMouse.x - rect.left;
      const ty = state.dragStartMouse.y - rect.top;
      const imgPos = screenToImage(tx, ty);
      if (state.editMode) {
        handleEditClick(imgPos.x, imgPos.y);
      } else {
        handleCellClick(imgPos.x, imgPos.y);
      }
    }
    state.dragging = false;
    state.pinching = false;
  } else if (e.touches.length === 1 && state.pinching) {
    state.pinching = false;
    state.dragging = true;
    state.hasMoved = false;
    state.dragStartMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    state.dragStartImgOff = { x: state.imgOffX, y: state.imgOffY };
  }
});

// 窗口大小变化时重绘，转屏自动适应
let _lastOrient = window.matchMedia('(orientation: portrait)').matches ? 'p' : 'l';
window.addEventListener('resize', () => {
  if (!state.image) return;
  const cur = window.matchMedia('(orientation: portrait)').matches ? 'p' : 'l';
  if (cur !== _lastOrient) { _lastOrient = cur; resetImage(); }
  else render();
});

// ===== 微调 =====
function toggleFineTune() {
  const panel = document.getElementById('fineTunePanel');
  panel.style.display = panel.style.display === 'none' ? '' : 'none';
}

function nudgeImage(dx, dy) {
  if (!state.image) return;
  state.imgOffX += dx;
  state.imgOffY += dy;
  updatePosStatus();
  render();
}

function nudgeScale(delta) {
  if (!state.image) return;
  const cx = canvasWrap.clientWidth / 2;
  const cy = canvasWrap.clientHeight / 2;
  const oldS = state.imgScale;
  state.imgScale = Math.max(0.05, Math.min(30, state.imgScale + delta));
  state.imgOffX = cx - (cx - state.imgOffX) * (state.imgScale / oldS);
  state.imgOffY = cy - (cy - state.imgOffY) * (state.imgScale / oldS);
  updatePosStatus();
  render();
}

function nudgeGrid(dx, dy) {
  state.gridOffX += dx;
  state.gridOffY += dy;
  render();
}

// ===== 切分 =====
async function lockGrid() {
  if (!state.image) return;

  const cs = state.cellSize;
  const s = state.imgScale;
  const ox = state.imgOffX;
  const oy = state.imgOffY;
  const imgW = state.image.width;
  const imgH = state.image.height;

  // 图片在屏幕上的范围
  const imgScrL = ox;
  const imgScrT = oy;
  const imgScrR = ox + imgW * s;
  const imgScrB = oy + imgH * s;

  // 覆盖图片的网格范围
  const modX = ((state.gridOffX % cs) + cs) % cs;
  const modY = ((state.gridOffY % cs) + cs) % cs;
  const firstCol = Math.floor((imgScrL - modX) / cs);
  const firstRow = Math.floor((imgScrT - modY) / cs);
  const lastCol = Math.ceil((imgScrR - modX) / cs);
  const lastRow = Math.ceil((imgScrB - modY) / cs);
  const totalCols = lastCol - firstCol;
  const totalRows = lastRow - firstRow;
  const total = totalRows * totalCols;

  if (total === 0 || total > 100000) {
    toast(`格子数 ${total} 异常，请调整格子大小`);
    return;
  }

  // 立即锁定图片
  state.locked = true;
  document.getElementById('btnLock').textContent = '处理中...';
  document.getElementById('btnLock').disabled = true;
  showLoading('采样颜色...');
  render();

  try {

  // 每个格子在图像上的大小
  const imgCellSize = cs / s;

  // 一次性获取整个图片的像素数据
  offCanvas.width = imgW;
  offCanvas.height = imgH;
  offCtx.drawImage(state.image, 0, 0);
  const fullImgData = offCtx.getImageData(0, 0, imgW, imgH);
  const fullPixels = fullImgData.data;

  state.cells = new Map();
  const colorClusters = [];

  // 从全图数据中采样每个格子
  for (let r = 0; r < totalRows; r++) {
    for (let c = 0; c < totalCols; c++) {
      const scrX = modX + (firstCol + c) * cs;
      const scrY = modY + (firstRow + r) * cs;
      const imgX = Math.round((scrX - ox) / s);
      const imgY = Math.round((scrY - oy) / s);
      const size = Math.round(imgCellSize);

      if (imgX + size <= 0 || imgY + size <= 0 || imgX >= imgW || imgY >= imgH) continue;
      const cx = Math.max(0, imgX);
      const cy = Math.max(0, imgY);
      const csz = Math.min(size, imgW - cx, imgH - cy);
      if (csz < 2) continue;

      const rgb = sampleFromData(fullPixels, imgW, imgH, cx, cy, csz);
      const key = `${r},${c}`;
      state.cells.set(key, { row: r, col: c, imgX: cx, imgY: cy, size: csz, rgb, code: null });

      // 颜色聚类
      let found = false;
      for (const cluster of colorClusters) {
        if (rgbDistance(rgb, cluster.rgb) < 25) {
          cluster.cellKeys.push(key);
          found = true;
          break;
        }
      }
      if (!found) {
        colorClusters.push({ rgb, cellKeys: [key] });
      }
    }

    if (r % 10 === 0) {
      showLoading(`采样 ${r + 1}/${totalRows} 行`);
      await sleep(0);
    }
  }

  const actualTotal = state.cells.size;
  showLoading(`${actualTotal}格, ${colorClusters.length}色, 加载OCR引擎...`);
  await sleep(0);

  // 复用单个worker，带进度回调
  const worker = await Tesseract.createWorker('eng', 1, {
    logger: m => {
      if (m.status === 'loading tesseract core') {
        showLoading(`加载OCR核心... ${m.progress ? Math.round(m.progress * 100) + '%' : ''}`);
      } else if (m.status === 'initializing tesseract') {
        showLoading('初始化OCR引擎...');
      } else if (m.status === 'loading language traineddata') {
        showLoading(`加载语言包... ${m.progress ? Math.round(m.progress * 100) + '%' : ''}`);
      }
    }
  });
  await worker.setParameters({ tessedit_pageseg_mode: 7 });
  showLoading(`${actualTotal}格, ${colorClusters.length}色, OCR识别中...`);

  let ocrDone = 0;
  for (const cluster of colorClusters) {
    const repKey = cluster.cellKeys[0];
    const repCell = state.cells.get(repKey);
    const code = await ocrCell(offCanvas, repCell.imgX, repCell.imgY, repCell.size, worker);
    const finalCode = code || '?';

    for (const key of cluster.cellKeys) {
      state.cells.get(key).code = finalCode;
    }

    ocrDone++;
    if (ocrDone % 5 === 0 || ocrDone === colorClusters.length) {
      showLoading(`OCR ${ocrDone}/${colorClusters.length} 色`);
      await sleep(1);
    }
  }
  await worker.terminate();

  // 建立颜色映射
  state.colorMap = new Map();
  for (const [key, cell] of state.cells) {
    const code = cell.code;
    let entry = state.colorMap.get(code);
    if (!entry) { entry = { code, rgb: cell.rgb, cells: [] }; state.colorMap.set(code, entry); }
    entry.cells.push({ row: cell.row, col: cell.col });
    // 颜色取平均
    const n = entry.cells.length;
    entry.rgb = entry.rgb.map((v, i) => Math.round((v * (n - 1) + cell.rgb[i]) / n));
  }

  state.selectedCell = null;
  state.highlightedCode = null;
  document.getElementById('btnLock').textContent = '重新切分';
  document.getElementById('btnLock').disabled = false;
  document.getElementById('btnBeading').disabled = false;
  document.getElementById('statusCells').textContent =
    `${actualTotal} 格 ${colorClusters.length} 色 | 点击格子查看详情`;

  hideLoading();
  renderColorMap();
  render();
  toast(`切分完成！${actualTotal}格，${colorClusters.length}种颜色`);
  } catch (err) {
    hideLoading();
    state.locked = false;
    document.getElementById('btnLock').textContent = '切分';
    document.getElementById('btnLock').disabled = false;
    toast(`OCR失败: ${err.message || '未知错误'}`);
  }
}

function showLoading(msg) {
  document.getElementById('loadingOverlay').style.display = '';
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('statusCells').textContent = msg;
}

function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

function sampleFromData(pixels, imgW, imgH, x, y, size) {
  // 直接从像素数组采样，避免多次 getImageData
  const margin = Math.max(1, Math.floor(size * 0.2));
  const sx = Math.max(0, x + margin);
  const sy = Math.max(0, y + margin);
  const ex = Math.min(x + size - margin, imgW);
  const ey = Math.min(y + size - margin, imgH);
  let r = 0, g = 0, b = 0, n = 0;
  for (let py = sy; py < ey; py++) {
    for (let px = sx; px < ex; px++) {
      const idx = (py * imgW + px) * 4;
      if (pixels[idx + 3] < 128) continue;
      r += pixels[idx]; g += pixels[idx + 1]; b += pixels[idx + 2]; n++;
    }
  }
  return n > 0 ? [Math.round(r / n), Math.round(g / n), Math.round(b / n)] : [128, 128, 128];
}

function sampleCellColor(ctx, x, y, size) {
  const margin = Math.max(1, Math.floor(size * 0.2));
  const sx = Math.max(0, x + margin);
  const sy = Math.max(0, y + margin);
  const sw = Math.min(size - margin * 2, ctx.canvas.width - sx);
  const sh = Math.min(size - margin * 2, ctx.canvas.height - sy);
  if (sw <= 0 || sh <= 0) return [128, 128, 128];

  const imgData = ctx.getImageData(sx, sy, sw, sh);
  const d = imgData.data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 128) continue;
    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
  }
  return n > 0 ? [Math.round(r / n), Math.round(g / n), Math.round(b / n)] : [128, 128, 128];
}

async function ocrCell(canvas, x, y, size, worker) {
  try {
    const sc = 4;
    const cellCanvas = document.createElement('canvas');
    cellCanvas.width = size * sc;
    cellCanvas.height = size * sc;
    const cctx = cellCanvas.getContext('2d');
    cctx.imageSmoothingEnabled = false;
    cctx.drawImage(canvas, x, y, size, size, 0, 0, cellCanvas.width, cellCanvas.height);

    // 增强对比度
    const imgData = cctx.getImageData(0, 0, cellCanvas.width, cellCanvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      for (let j = 0; j < 3; j++) {
        d[i + j] = Math.max(0, Math.min(255, (d[i + j] - 80) * 2.2));
      }
    }
    cctx.putImageData(imgData, 0, 0);

    const ownWorker = !worker;
    if (ownWorker) {
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_pageseg_mode: 7 });
    }
    const result = await worker.recognize(cellCanvas.toDataURL('image/png'));
    if (ownWorker) await worker.terminate();

    const text = result.data.text.trim().replace(/[|{}[\]~`]/g, '');
    const match = text.match(/([A-Za-z]{1,2}\s*\d{1,3})/);
    return match ? match[1].replace(/\s+/g, '').toUpperCase() : (text.substring(0, 5) || null);
  } catch (e) {
    return null;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== 编辑模式：点击格子切换归属 =====
function handleEditClick(imgX, imgY) {
  if (!state.cells) return;
  let found = null;
  for (const [key, cell] of state.cells) {
    if (imgX >= cell.imgX && imgX < cell.imgX + cell.size &&
        imgY >= cell.imgY && imgY < cell.imgY + cell.size) {
      found = cell;
      break;
    }
  }
  if (!found) return;

  const key = `${found.row},${found.col}`;
  const editingCode = state.editingCode;

  if (found.code === editingCode) {
    // 从当前编辑色号中移除
    removeCellFromCode(found, editingCode);
    toast(`${found.row + 1}行${found.col + 1}列 已移除`);
  } else {
    // 加入当前编辑色号
    if (found.code && state.colorMap && state.colorMap.has(found.code)) {
      removeCellFromCode(found, found.code);
    }
    found.code = editingCode;
    let entry = state.colorMap.get(editingCode);
    if (!entry) { entry = { code: editingCode, rgb: found.rgb, cells: [] }; state.colorMap.set(editingCode, entry); }
    entry.cells.push({ row: found.row, col: found.col });
    toast(`${found.row + 1}行${found.col + 1}列 → ${editingCode}`);
  }

  renderColorMap();
  render();
}

function removeCellFromCode(cell, code) {
  if (!state.colorMap) return;
  const entry = state.colorMap.get(code);
  if (!entry) return;
  entry.cells = entry.cells.filter(c => !(c.row === cell.row && c.col === cell.col));
  if (entry.cells.length === 0) state.colorMap.delete(code);
  cell.code = '?';
}

// ===== 格子点击 =====
function handleCellClick(imgX, imgY) {
  if (!state.locked || !state.cells) return;

  let found = null;
  for (const [key, cell] of state.cells) {
    if (imgX >= cell.imgX && imgX < cell.imgX + cell.size &&
        imgY >= cell.imgY && imgY < cell.imgY + cell.size) {
      found = cell;
      break;
    }
  }

  if (found) {
    state.selectedCell = { row: found.row, col: found.col };
    state.highlightedCode = null;
    renderCellInfo(found);
    renderColorMap();
    render();

    if (!found.code || found.code === '?') {
      reOCRCell(found.row, found.col);
    }
  }
}

async function reOCRCell(row, col) {
  const key = `${row},${col}`;
  const cell = state.cells.get(key);
  if (!cell) return;

  offCanvas.width = state.image.width;
  offCanvas.height = state.image.height;
  offCtx.drawImage(state.image, 0, 0);
  const code = await ocrCell(offCanvas, cell.imgX, cell.imgY, cell.size);

  // 从旧映射移除
  if (cell.code && state.colorMap) {
    const old = state.colorMap.get(cell.code);
    if (old) {
      old.cells = old.cells.filter(c => !(c.row === row && c.col === col));
      if (old.cells.length === 0) state.colorMap.delete(cell.code);
    }
  }

  cell.code = code || '?';
  let entry = state.colorMap.get(cell.code);
  if (!entry) { entry = { code: cell.code, rgb: cell.rgb, cells: [] }; state.colorMap.set(cell.code, entry); }
  entry.cells.push({ row, col });

  renderCellInfo(cell);
  renderColorMap();
  toast(`OCR: ${cell.code}`);
}

function isValidCode(code) {
  if (!code || code === '?') return false;
  return /^[A-Za-z]\d{1,2}$/.test(code);
}

function getTextColor(rgb) {
  const [r, g, b] = rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45 ? '#000' : '#fff';
}

// ===== 颜色映射面板 =====
function renderColorMap() {
  const listEl = document.getElementById('colorMapList');
  document.getElementById('mapCount').textContent = '';

  if (!state.colorMap || state.colorMap.size === 0) {
    listEl.innerHTML = '<div style="color:#555;text-align:center;padding:30px 0;font-size:12px">切分后颜色映射显示在此处</div>';
    return;
  }

  // 只显示有效色号，未识别的直接遗弃
  const valid = [];
  for (const [code, entry] of state.colorMap) {
    if (isValidCode(code)) valid.push([code, entry]);
  }
  valid.sort((a, b) => {
    const am = a[0].match(/^([A-Za-z])(\d{1,2})$/);
    const bm = b[0].match(/^([A-Za-z])(\d{1,2})$/);
    if (am && bm) {
      if (am[1] !== bm[1]) return am[1].localeCompare(bm[1]);
      return parseInt(am[2]) - parseInt(bm[2]);
    }
    return a[0].localeCompare(b[0]);
  });

  document.getElementById('mapCount').textContent = `(${valid.length}色)`;

  const editCode = state.editMode ? state.editingCode : null;

  let html = '';
  for (const [code, entry] of valid) {
    const editing = code === editCode;
    const rgb = entry.rgb || [128, 128, 128];
    const bg = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    const tc = getTextColor(rgb);

    if (state.beadingMode) {
      const checked = state.activeColors.has(code);
      html += `
        <div class="color-item" style="background:${bg};color:${tc}" onclick="toggleActiveColor('${esc(code)}')">
          <div class="info">
            <div class="code">${esc(code)}</div>
            <div class="count">${entry.cells.length} 格</div>
          </div>
          <input type="checkbox" ${checked ? 'checked' : ''}>
        </div>`;
    } else {
      const sel = editing ? ' selected' : '';
      html += `
        <div class="color-item${sel}" style="background:${bg};color:${tc}" onclick="${editing ? 'exitEditMode()' : `enterEditMode('${esc(code)}')`}">
          <div class="info">
            <div class="code">${esc(code)}</div>
            <div class="count">${entry.cells.length} 格${editing ? ' — 编辑中...' : ''}</div>
          </div>
          <button class="edit-btn" onclick="event.stopPropagation();editCode('${esc(code)}')" title="重命名色号">✎</button>
        </div>`;
    }
  }

  listEl.innerHTML = html;
}

function enterEditMode(code) {
  if (state.beadingMode) return;
  state.editMode = true;
  state.editingCode = code;
  state.selectedCell = null;
  state.highlightedCode = code;
  renderCellInfo();
  updateEditModeUI();
  renderColorMap();
  render();
}

function exitEditMode() {
  state.editMode = false;
  state.editingCode = null;
  state.highlightedCode = null;
  state.selectedCell = null;
  renderCellInfo();
  updateEditModeUI();
  renderColorMap();
  render();
}

function toggleBeadingMode() {
  if (!state.locked) return;
  if (state.beadingMode) {
    exitBeadingMode();
  } else {
    enterBeadingMode();
  }
}

function enterBeadingMode() {
  if (state.editMode) exitEditMode();
  state.beadingMode = true;
  state.activeColors = new Set();
  document.getElementById('btnBeading').textContent = '退出拼豆';
  document.getElementById('btnBeading').classList.add('active');
  document.getElementById('btnLock').disabled = true;
  renderColorMap();
  renderCellInfo();
  render();
}

function exitBeadingMode() {
  state.beadingMode = false;
  state.activeColors = new Set();
  document.getElementById('btnBeading').textContent = '开始拼豆';
  document.getElementById('btnBeading').classList.remove('active');
  document.getElementById('btnLock').disabled = false;
  renderColorMap();
  renderCellInfo();
  render();
}

function toggleActiveColor(code) {
  if (!state.beadingMode) return;
  if (state.activeColors.has(code)) {
    state.activeColors.delete(code);
  } else {
    state.activeColors.add(code);
  }
  renderColorMap();
  render();
}

function updateEditModeUI() {
  const sep = document.getElementById('editModeSep');
  const label = document.getElementById('editModeLabel');
  const btn = document.getElementById('btnFinishEdit');
  if (state.editMode) {
    sep.style.display = '';
    label.style.display = '';
    label.textContent = '编辑: ' + state.editingCode;
    btn.style.display = '';
  } else {
    sep.style.display = 'none';
    label.style.display = 'none';
    btn.style.display = 'none';
  }
}

function editCode(oldCode) {
  if (state.beadingMode || !state.colorMap) return;
  const entry = state.colorMap.get(oldCode);
  if (!entry) return;

  const validCodes = [...state.colorMap.keys()].filter(c => isValidCode(c) && c !== oldCode);

  // 构建选项列表
  let msg = `修改色号 "${oldCode}" (${entry.cells.length}格)\n`;
  if (validCodes.length > 0) {
    msg += `\n已有色号:\n${validCodes.slice(0, 15).join(', ')}${validCodes.length > 15 ? '...' : ''}\n`;
  }
  msg += '\n输入新色号（留空取消）:';

  const newCode = prompt(msg, isValidCode(oldCode) ? oldCode : '');
  if (!newCode || newCode.trim() === '' || newCode.trim() === oldCode) return;

  const finalCode = newCode.trim().toUpperCase();

  // 如果目标色号已存在，合并
  if (state.colorMap.has(finalCode)) {
    const target = state.colorMap.get(finalCode);
    for (const {row, col} of entry.cells) {
      const cell = state.cells.get(`${row},${col}`);
      if (cell) cell.code = finalCode;
      target.cells.push({row, col});
    }
    state.colorMap.delete(oldCode);
  } else {
    // 重命名
    for (const {row, col} of entry.cells) {
      const cell = state.cells.get(`${row},${col}`);
      if (cell) cell.code = finalCode;
    }
    state.colorMap.delete(oldCode);
    state.colorMap.set(finalCode, entry);
    entry.code = finalCode;
  }

  if (state.highlightedCode === oldCode) state.highlightedCode = finalCode;
  if (state.editingCode === oldCode) state.editingCode = finalCode;
  if (state.selectedCell) {
    const cell = state.cells.get(`${state.selectedCell.row},${state.selectedCell.col}`);
    if (cell && cell.code === finalCode) renderCellInfo(cell);
  }
  renderColorMap();
  render();
  toast(`色号已更新: ${oldCode} → ${finalCode}`);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== 格子详情 =====
function getValidCodes() {
  if (!state.colorMap) return [];
  return [...state.colorMap.keys()].filter(c => isValidCode(c)).sort();
}

function renderCellInfo(cell) {
  const el = document.getElementById('cellInfo');
  if (state.beadingMode) {
    const n = state.activeColors.size;
    el.innerHTML = `<div style="color:#4ade80;font-size:12px;font-weight:600;margin-bottom:4px">拼豆模式</div>
      <div style="color:#aaa;font-size:11px">已选 ${n} 种颜色<br>勾选侧栏色号显示对应格子<br>点击"退出拼豆"返回</div>`;
    return;
  }
  if (state.editMode) {
    el.innerHTML = `<div style="color:#e94560;font-size:12px;font-weight:600;margin-bottom:4px">编辑模式: ${state.editingCode}</div>
      <div style="color:#aaa;font-size:11px">点击图上格子切换归属<br>红色高亮 = 已归属此色号<br>点击"完成编辑"退出</div>`;
    return;
  }
  if (!cell) {
    el.innerHTML = '<div style="color:#555;font-size:11px">切分后点击格子查看详情</div>';
    return;
  }
  const rgbStr = `rgb(${cell.rgb[0]},${cell.rgb[1]},${cell.rgb[2]})`;
  const codeValid = isValidCode(cell.code);
  const validCodes = getValidCodes();

  let actionHtml = '';
  if (!codeValid) {
    actionHtml = '<div class="label" style="margin-top:8px;color:#f87171">色号未识别，点击分配:</div>';
    if (validCodes.length > 0) {
      const showCodes = validCodes.slice(0, 12);
      actionHtml += '<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px">' +
        showCodes.map(c => `<button onclick="assignCell('${esc(c)}')" style="padding:2px 7px;font-size:10px;background:#0f3460;border:1px solid #1a4a7a;border-radius:3px;color:#e0e0e0;cursor:pointer">${esc(c)}</button>`).join('') +
        (validCodes.length > 12 ? `<span style="color:#666;font-size:10px">+${validCodes.length - 12}更多</span>` : '') +
        '</div>';
    }
    actionHtml += `
      <div style="display:flex;gap:4px;margin-top:4px">
        <input id="newCodeInput" placeholder="输入新色号" style="flex:1;padding:3px 6px;font-size:11px;background:#111;border:1px solid #0f3460;border-radius:3px;color:#e0e0e0">
        <button onclick="assignCell(document.getElementById('newCodeInput').value)" style="padding:3px 8px;font-size:10px;background:#1a6a3a;border:1px solid #1a6a3a;border-radius:3px;color:#fff;cursor:pointer;white-space:nowrap">分配</button>
      </div>`;
  }

  el.innerHTML = `
    <div class="label">色号</div>
    <div class="val" style="font-size:15px;font-weight:700;color:${codeValid ? '#e0e0e0' : '#f87171'}">${cell.code || '未识别'}</div>
    <div class="label">颜色 <span class="swatch-preview" style="background:${rgbStr}"></span></div>
    <button onclick="reOCRSelected()" style="margin-top:4px;padding:3px 10px;font-size:10px;background:#0f3460;border:1px solid #1a4a7a;border-radius:3px;color:#e0e0e0;cursor:pointer">重新OCR</button>
    ${actionHtml}
  `;
}

// 手动分配色号给当前选中格子
function assignCell(newCode) {
  if (!state.selectedCell || !newCode || newCode.trim() === '') return;
  const finalCode = newCode.trim().toUpperCase();
  const { row, col } = state.selectedCell;

  // 更新格子色号
  const key = `${row},${col}`;
  const cell = state.cells.get(key);
  if (!cell) return;

  // 从旧映射移除
  if (cell.code && state.colorMap) {
    const old = state.colorMap.get(cell.code);
    if (old) {
      old.cells = old.cells.filter(c => !(c.row === row && c.col === col));
      if (old.cells.length === 0) state.colorMap.delete(cell.code);
    }
  }

  cell.code = finalCode;

  // 加入新映射
  let entry = state.colorMap.get(finalCode);
  if (!entry) {
    entry = { code: finalCode, rgb: cell.rgb, cells: [] };
    state.colorMap.set(finalCode, entry);
  }
  entry.cells.push({ row, col });

  renderCellInfo(cell);
  renderColorMap();
  render();
  toast(`${row + 1}行${col + 1}列 → ${finalCode}`);
}

async function reOCRSelected() {
  if (!state.selectedCell) return;
  await reOCRCell(state.selectedCell.row, state.selectedCell.col);
}

// ===== 键盘 =====
document.addEventListener('keydown', e => {
  if (!state.image) return;
  if (e.target.tagName === 'INPUT') return;

  if (!state.locked) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (e.shiftKey) state.gridOffX -= 1; else state.imgOffX -= 1; }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (e.shiftKey) state.gridOffX += 1; else state.imgOffX += 1; }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (e.shiftKey) state.gridOffY -= 1; else state.imgOffY -= 1; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (e.shiftKey) state.gridOffY += 1; else state.imgOffY += 1; }
    if (e.key === '0') { e.preventDefault(); resetImage(); }
    updatePosStatus();
    render();
  }

  if (e.key === 'Escape') {
    if (state.beadingMode) {
      state.activeColors = new Set();
      renderColorMap();
      render();
    } else if (state.editMode) {
      exitEditMode();
    } else {
      state.selectedCell = null;
      state.highlightedCode = null;
      renderCellInfo();
      renderColorMap();
      render();
    }
  }

  // 回车切分
  if (e.key === 'Enter' && !state.locked) { e.preventDefault(); lockGrid(); }
});

// ===== 工具 =====
function updateStatus() {
  document.getElementById('statusImage').textContent = state.image
    ? `图片: ${state.image.width}×${state.image.height}`
    : '未加载图片';
}

function updatePosStatus() {
  document.getElementById('statusPos').textContent =
    `缩放:${state.imgScale.toFixed(3)} 位置:(${Math.round(state.imgOffX)},${Math.round(state.imgOffY)}) 格大小:${state.cellSize}px`;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function rgbDistance(r1, g1, b1, r2, g2, b2) {
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt(2 * dr * dr + 4 * dg * dg + 3 * db * db);
}

updatePosStatus();
resetImage();
</script>
</body>
</html>
